name: Build posters
on:
  push:
    paths: ["build.py", "hero.py", "products.json", "urls.json", ".github/workflows/build.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: |
          python hero.py posters/00_hero_a.jpg
          TAG="GIFTS FROM KES 1,500" L1="Gold, ladies' & everyday watches" L2="Ready in Nairobi  ·  One of each only" python hero.py posters/00_hero_b.jpg
          python build.py
      - run: |
          git config user.name "poster-bot"
          git config user.email "poster-bot@users.noreply.github.com"
          git add posters
          git diff --cached --quiet || git commit -m "Build posters"
          git push
