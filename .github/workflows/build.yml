name: Build posters
on:
  push:
    paths: ["build.py", "hero.py", "products.json", ".github/workflows/build.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python hero.py && python build.py
      - run: |
          git config user.name "poster-bot"
          git config user.email "poster-bot@users.noreply.github.com"
          git add posters
          git diff --cached --quiet || git commit -m "Build posters"
          git push
